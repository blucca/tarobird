# ACCEPTANCE-ONLY BRANCH COPY (#48 full chain). Never merge into main. On a
# disposable GitHub-hosted Windows runner: real Hub; controlled side = the
# product ScreenService (real desktopCapturer capture, real native input) with
# an owned test window; controller = the real RemoteScreenPanel in an Electron
# shell with the product DesktopServices/ScreenViewers, driven by Playwright.
# Redacted results to the job log only: no artifacts, signing, publishing or
# cache writes.
name: Windows release upgrade acceptance
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Acceptance scope
        type: choice
        options: [fullchain]
        default: fullchain
permissions:
  contents: read
jobs:
  win48-fullchain:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Acceptance runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This acceptance-only workflow copy runs only from an accept/* branch" }
          "runner=$env:RUNNER_ENVIRONMENT os=$env:ImageOS image=$env:ImageVersion ref=$env:REF sha=${{ github.sha }}"
      - name: LF checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-desktop-native -> target
          save-if: false
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "root npm ci failed" }
          npm ci --prefix client
          if ($LASTEXITCODE -ne 0) { throw "client npm ci failed" }
      - name: Build root Hub and protocol dist
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "root build failed" }
      - name: Build native Windows addon
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fc-native-target.noindex
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --manifest-path client/src-desktop-native/Cargo.toml --release --locked --target x86_64-pc-windows-msvc --lib
          if ($LASTEXITCODE -ne 0) { throw "native addon build failed" }
          $outDir = Join-Path $env:RUNNER_TEMP "fc-native.noindex"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $addon = Join-Path $outDir "tarobot-desktop-native.node"
          Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc\release\tarobot_desktop_native.dll") -Destination $addon -Force
          "addon_sha256=$((Get-FileHash -LiteralPath $addon -Algorithm SHA256).Hash.ToLower())"
          "TAROBOT_WIN_ADDON=$addon" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Full chain (controller B -> real Hub -> controlled A, real capture and input)
        shell: pwsh
        env:
          TAROBOT_WINDOWS_ACCEPTANCE: disposable
        run: |
          node client/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw "Electron binary install failed" }
          $electron = (node -p "require('./client/node_modules/electron')").Trim()
          node client/scripts/win48-fullchain/run.mjs --electron $electron --addon $env:TAROBOT_WIN_ADDON --report (Join-Path $env:RUNNER_TEMP "fc-report.noindex") --source-commit ${{ github.sha }}
          if ($LASTEXITCODE -ne 0) { throw "full chain reported failure; see log" }
