# ACCEPTANCE-ONLY BRANCH COPY (#48 E4 real capture). Never merge this file
# into main: on a disposable GitHub-hosted Windows runner it covers the runner
# desktop with an owned full-screen colour test window, runs the product
# remote-screen capture path (ScreenService -> ScreenCaptureHost ->
# desktopCapturer) against a real Hub with a view-only viewer, then checks
# the standby view-only entry (own synthetic window as the only source) on
# the same Hub, and writes redacted statistics to the job log and summary only. No signing, no
# publishing, no artifact upload, no cache writes, no input injection.
name: Windows release upgrade acceptance
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Acceptance scope
        type: choice
        options: [capture-viewonly]
        default: capture-viewonly
permissions:
  contents: read
jobs:
  windows-capture-acceptance:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Acceptance runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This acceptance-only workflow copy runs only from an accept/* branch" }
          "runner=$env:RUNNER_ENVIRONMENT os=$env:ImageOS image=$env:ImageVersion ref=$env:REF sha=${{ github.sha }}"

      - name: Check out LF sources (bundle hashes comparable across hosts)
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-desktop-native -> target
          # Acceptance branch: restore only, never save build outputs.
          save-if: false

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "root npm ci failed" }
          npm ci --prefix client
          if ($LASTEXITCODE -ne 0) { throw "client npm ci failed" }

      - name: Build root Hub and protocol dist
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "root build failed" }

      - name: Build native Windows addon (tarobot-desktop-native.node)
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/wincapture-native-target.noindex
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --manifest-path client/src-desktop-native/Cargo.toml --release --locked --target x86_64-pc-windows-msvc --lib
          if ($LASTEXITCODE -ne 0) { throw "native addon build failed" }
          $outDir = Join-Path $env:RUNNER_TEMP "wincapture-native.noindex"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $dll = Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc\release\tarobot_desktop_native.dll"
          $addon = Join-Path $outDir "tarobot-desktop-native.node"
          Copy-Item -LiteralPath $dll -Destination $addon -Force
          $hash = (Get-FileHash -LiteralPath $addon -Algorithm SHA256).Hash.ToLower()
          "addon_sha256=$hash"
          "TAROBOT_WIN_ADDON=$addon" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: E4 real capture acceptance (owned colour window, view-only viewer)
        shell: pwsh
        env:
          TAROBOT_WINDOWS_ACCEPTANCE: disposable
        run: |
          node client/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw "Electron binary install failed" }
          $electron = (node -p "require('./client/node_modules/electron')").Trim()
          if (-not (Test-Path -LiteralPath $electron)) { throw "Resolved Electron binary missing" }
          $report = Join-Path $env:RUNNER_TEMP "wincapture-report.noindex"
          node client/scripts/windows-capture-acceptance.mjs `
            --confirm-disposable-windows `
            --electron $electron `
            --addon $env:TAROBOT_WIN_ADDON `
            --report $report `
            --source-commit ${{ github.sha }} `
            --with-viewonly
          if ($LASTEXITCODE -ne 0) { throw "Windows capture acceptance reported failure; see summary" }

      - name: Publish redacted statistics to job log and summary only (no uploads)
        if: always()
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "wincapture-report.noindex"
          $md = Join-Path $report "windows-capture-acceptance.md"
          $json = Join-Path $report "windows-capture-acceptance.json"
          if (Test-Path -LiteralPath $md) { Get-Content -LiteralPath $md -Raw | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
          if (Test-Path -LiteralPath $json) {
            "===== windows-capture-acceptance.json ====="
            Get-Content -LiteralPath $json -Raw
          }
