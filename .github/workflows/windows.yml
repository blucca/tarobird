# ACCEPTANCE-ONLY BRANCH COPY (#50 local setup notes). Never merge this file
# into main: it replaces the Windows build with a small NSIS probe that reuses
# the product's installer macros. No build, signing, artifact upload, cache
# save or release. Runs only on a disposable GitHub-hosted runner, accept/*.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows CPU architecture
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  setup-notes:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Setup notes acceptance runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This acceptance-only workflow copy runs only from an accept/* branch" }
          "runner=$env:RUNNER_ENVIRONMENT os=$env:ImageOS image=$env:ImageVersion ref=$env:REF"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: "#50 local setup notes probe (product 1e3d2003e1978a46293cbe909b5c15e2bfb92dc2, baseline 4b5ed5f29197e43a18554c557dfb1144f8cbd7ee)"
        shell: pwsh
        env:
          TAROBOT_WINDOWS_ACCEPTANCE: disposable
        run: |
          node client/scripts/acceptance-setup-notes/run.mjs --confirm-disposable-windows --report "$env:RUNNER_TEMP\setup-notes.noindex" --product 1e3d2003e1978a46293cbe909b5c15e2bfb92dc2 --baseline 4b5ed5f29197e43a18554c557dfb1144f8cbd7ee
          if ($LASTEXITCODE -ne 0) { throw "Setup notes acceptance did not pass" }
