# ACCEPTANCE-ONLY BRANCH COPY (#50: a released uninstaller run in place by the
# new installer). Never merge this file into main: it replaces the Windows build
# with small NSIS probes built from the product's installer.nsi text and the
# windows-tarobot-v1.5.1 tag's uninstaller text. No TaroBird build, signing,
# artifact upload, cache save or release. Disposable GitHub-hosted runner, accept/*.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows CPU architecture
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  old-uninstaller-language:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Old uninstaller language acceptance runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This acceptance-only workflow copy runs only from an accept/* branch" }
          "runner=$env:RUNNER_ENVIRONMENT os=$env:ImageOS image=$env:ImageVersion ref=$env:REF"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Fetch the released 1.5.1 tag only
        shell: pwsh
        run: git fetch --no-tags --depth=1 origin +refs/tags/windows-tarobot-v1.5.1:refs/tags/windows-tarobot-v1.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: "Old uninstaller language probe (product 4623372d0295b70a7d36690d0c3985c0747e9d38, baseline cd594689d6fb0d68ada4d11290e844c8663fdb88, release 352a6c8ae25080580cbf758c721da76f662492b8)"
        shell: pwsh
        env:
          TAROBOT_WINDOWS_ACCEPTANCE: disposable
        run: |
          node client/scripts/acceptance-old-uninstaller-language/run.mjs --confirm-disposable-windows --report "$env:RUNNER_TEMP\old-uninstaller-language.noindex" --product 4623372d0295b70a7d36690d0c3985c0747e9d38 --baseline cd594689d6fb0d68ada4d11290e844c8663fdb88 --release 352a6c8ae25080580cbf758c721da76f662492b8
          if ($LASTEXITCODE -ne 0) { throw "Old uninstaller language acceptance did not pass" }
