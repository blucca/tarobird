# ACCEPTANCE-ONLY TRIAGE BRANCH COPY (#50 native, pass 2). Never merge this file into main:
# it builds no installer, signs nothing, uploads nothing and publishes nothing.
# It reruns only the "Native Rust regressions on the x64 runner" cargo commands
# and the three native integration tests of windows-acceptance.mjs --scope native
# against the exact product tree of the candidate, on a disposable runner.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows CPU architecture
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAROBOT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Native triage runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This acceptance-only workflow copy runs only from an accept/* branch" }
          "runner=$env:RUNNER_ENVIRONMENT os=$env:ImageOS image=$env:ImageVersion ref=$env:REF"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          save-if: false
      # Second triage pass: is system::a_process_not_started_by_electron_main_is_refused
      # order-dependent inside one test process? Same command and environment as
      # the step 19 native part, varying only the test filter.
      - name: Source-guard isolation check
        shell: pwsh
        env:
          TAROBOT_WINDOWS_ACCEPTANCE: disposable
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-native-tests.noindex
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          Remove-Item Env:RUSTFLAGS -ErrorAction SilentlyContinue
          Remove-Item Env:CARGO_ENCODED_RUSTFLAGS -ErrorAction SilentlyContinue
          $ErrorActionPreference = 'Continue'
          $base = @('test', '--manifest-path', 'client/src-desktop-updater/Cargo.toml', '--locked', '--target', 'x86_64-pc-windows-msvc', '--test', 'windows_source_guard', '--')
          $cases = [ordered]@{
            'A-isolated'         = @('--exact', 'system::a_process_not_started_by_electron_main_is_refused', '--nocapture')
            'B-without-late-app' = @('--test-threads=1', '--skip', 'system::a_late_old_app_finds_the_guard_window_and_its_forward_is_acknowledged')
            'C-full-binary'      = @('--test-threads=1')
          }
          $summary = @('### Source-guard isolation check', '```')
          foreach ($name in $cases.Keys) {
            Write-Output "::group::$name cargo $(($base + $cases[$name]) -join ' ')"
            & cargo @($base + $cases[$name]) 2>&1 | Tee-Object -Variable out | Write-Output
            $code = $LASTEXITCODE
            Write-Output "::endgroup::"
            Write-Output "RESULT $name exit=$code"
            $summary += "RESULT $name exit=$code"
            $summary += @(@($out) | ForEach-Object { "$_" } | Where-Object { $_ -match '^test result:|^test .* (FAILED|ok)$|panicked at|left:|right:' })
          }
          $summary += '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
