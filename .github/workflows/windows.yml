# ACCEPTANCE-ONLY PROBE BRANCH (#50 follow-up: install/notification-aumid).
# Never merge into main. Builds and installs nothing: it creates per-user
# Start Menu shortcuts to copies of a system exe on a disposable
# GitHub-hosted runner and polls Get-StartApps. No upload, signing or release.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Unused by this probe
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  aumid-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Probe runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "Probe runs only from an accept/* branch" }
          "runner=$env:RUNNER_ENVIRONMENT image=$env:ImageOS $env:ImageVersion ref=$env:REF"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            client/scripts/acceptance-probe
            client/scripts/windows-acceptance.mjs
            client/windows-electron
      - name: Build the NSIS fixture with the product's utils.nsh (no TaroBird build)
        shell: pwsh
        run: |
          $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { choco install nsis --no-progress -y | Out-Null; $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          $work = Join-Path $env:LOCALAPPDATA 'TaroBirdAumidProbe'; New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item "$env:SystemRoot\System32\whoami.exe" (Join-Path $work 'nsis.exe') -Force
          & $makensis /V2 "/DUTILS=$PWD\client\windows-electron\utils.nsh" "/DTARGET=$work\nsis.exe" "/DOUT=$env:RUNNER_TEMP\aumid-fixture.exe" client/scripts/acceptance-probe/aumid-fixture.nsi
          if ($LASTEXITCODE -ne 0) { throw "fixture build failed" }
          & $makensis /V2 "/DUTILS=$PWD\client\windows-electron\utils.nsh" "/DTARGET=$work\nsis.exe" "/DLINK=TaroBird AUMID Probe Race" "/DOUT=$env:RUNNER_TEMP\aumid-fixture-race.exe" client/scripts/acceptance-probe/aumid-fixture.nsi
          if ($LASTEXITCODE -ne 0) { throw "race fixture build failed" }
      - name: "Start Menu AppID probe (Windows PowerShell 5.1, like windows-acceptance.mjs)"
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'  # keep the probe's stderr as evidence instead of stopping on it
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File client/scripts/acceptance-probe/aumid-start-apps-probe.ps1 -PollSeconds 30 -NsisFixture "$env:RUNNER_TEMP\aumid-fixture.exe" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\probe.log"
          $code = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @('### Start Menu AppID probe', '```', (Get-Content -Raw "$env:RUNNER_TEMP\probe.log").Trim(), '```')
          exit $code
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: 24
      - name: "Same chain as the acceptance step: pwsh -> node -> windowsSystem().powershell"
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $out = node client/scripts/acceptance-probe/aumid-acceptance-context.mjs com.tarobot.aumidprobe.lpwstr com.tarobot.aumidprobe.bstrproduct com.tarobot.aumidprobe.nsis 2>&1 | Out-String
          Write-Output $out
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @('### Acceptance-chain query', '```', $out.Trim(), '```')
