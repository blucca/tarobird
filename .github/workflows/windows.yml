# ACCEPTANCE-ONLY PROBE BRANCH (#50 ext2 step watchdog). Never merge into main.
# No TaroBird build or install: checks that acceptance-step-watchdog.ps1 ends a
# hung node tree whose grandchild holds inherited stdio, lets later steps run and
# the job finish with logs. No upload, signing or release.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Unused by this probe
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  watchdog-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Probe runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "Probe runs only from an accept/* branch" }
      - uses: actions/checkout@v4
        with:
          sparse-checkout: client/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: "Hung node with a stdio-inheriting grandchild, under a 1-minute watchdog (expected to fail with 124)"
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          & client/scripts/acceptance-step-watchdog.ps1 -Name hung -Minutes 1 -ArgumentLine "client/scripts/acceptance-probe/pipe-holder.mjs"
          if ($LASTEXITCODE -ne 0) { throw "watchdog ended the hung step with $LASTEXITCODE (expected 124)" }
      - name: Next step still runs; nothing of the hung tree is left
        shell: pwsh
        run: |
          "after the hung step: $(Get-Date -Format o)"
          $left = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'Start-Sleep -Seconds 900|pipe-holder' })
          "left: $($left.Count) $($left | ForEach-Object { $_.ProcessId })"
      - name: A normal step under the watchdog
        shell: pwsh
        run: |
          & client/scripts/acceptance-step-watchdog.ps1 -Name quick -Minutes 1 -ArgumentLine "client/scripts/acceptance-probe/quick.mjs"
          if ($LASTEXITCODE -ne 0) { throw "quick failed $LASTEXITCODE" }
