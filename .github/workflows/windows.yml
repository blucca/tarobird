# ACCEPTANCE-ONLY BRANCH COPY (Windows /P language). Never merge this file
# into main: it replaces the Windows build with a small NSIS probe that reuses
# the product's installer-language.nsh. No build, signing, artifact upload,
# cache save or release. Runs only on a disposable GitHub-hosted runner, accept/*.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows CPU architecture
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  passive-language:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Passive language acceptance runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This acceptance-only workflow copy runs only from an accept/* branch" }
          "runner=$env:RUNNER_ENVIRONMENT os=$env:ImageOS image=$env:ImageVersion ref=$env:REF"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: "Windows /P language probe (product 8a863826206bbd41ebbee1f6a05b31d343f96e80, baseline cfbf8f0fc06c0b489ae29209b0b8d3f452a67778)"
        shell: pwsh
        env:
          TAROBOT_WINDOWS_ACCEPTANCE: disposable
        run: |
          node client/scripts/acceptance-passive-language/run.mjs --confirm-disposable-windows --report "$env:RUNNER_TEMP\passive-language.noindex" --product 8a863826206bbd41ebbee1f6a05b31d343f96e80 --baseline cfbf8f0fc06c0b489ae29209b0b8d3f452a67778
          if ($LASTEXITCODE -ne 0) { throw "Passive language acceptance did not pass" }
