# ACCEPTANCE-ONLY BRANCH COPY (#50 installer follow-ups S3, S1, S2). Never
# merge this file into main: it replaces the Windows build with a small NSIS
# probe compiled from the product's own installer.nsi text and includes. No
# TaroBird build, signing, artifact upload, cache save or release. Runs only on
# a disposable GitHub-hosted runner, accept/*.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows CPU architecture
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  installer-followups:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Installer follow-ups acceptance runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This acceptance-only workflow copy runs only from an accept/* branch" }
          "runner=$env:RUNNER_ENVIRONMENT os=$env:ImageOS image=$env:ImageVersion ref=$env:REF"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: "Installer follow-ups probe (product 83924da147445fed7e35f3ef367911d53af2ba7e, language baseline 2e4e35e274cb6bf045dbe077bb4a018414804661, baseline 47450f7a732e2d2625b7acafc63f8d6c190a3522)"
        shell: pwsh
        env:
          TAROBOT_WINDOWS_ACCEPTANCE: disposable
        run: |
          node client/scripts/acceptance-installer-followups/run.mjs --confirm-disposable-windows --report "$env:RUNNER_TEMP\installer-followups.noindex" --product 83924da147445fed7e35f3ef367911d53af2ba7e --language-baseline 2e4e35e274cb6bf045dbe077bb4a018414804661 --baseline 47450f7a732e2d2625b7acafc63f8d6c190a3522
          if ($LASTEXITCODE -ne 0) { throw "Installer follow-ups acceptance did not pass" }
