# ACCEPTANCE-ONLY PROBE BRANCH (#50 extension pre-check). Never merge into main.
# Builds and installs no TaroBird package: pinned release downloads (hash only,
# nothing is run from them), an NSIS fixture for the CJK/space directory and
# review N2, and driver syntax. No upload, signing or release.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Unused by this probe
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  extension-probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Probe runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "Probe runs only from an accept/* branch" }
          "runner=$env:RUNNER_ENVIRONMENT image=$env:ImageOS $env:ImageVersion ref=$env:REF"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: client/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the N2 fixture
        shell: pwsh
        run: |
          $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { choco install nsis --no-progress -y | Out-Null; $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $makensis /V2 "/DOUT=$env:RUNNER_TEMP\n2-fixture.exe" client/scripts/acceptance-probe/n2-fixture.nsi
          if ($LASTEXITCODE -ne 0) { throw "fixture build failed" }
      - name: "Extension pre-check: pinned downloads, CJK/space /D= and _?= (N2), driver syntax"
        shell: pwsh
        run: |
          node client/scripts/acceptance-probe/extension-probe.mjs "$env:RUNNER_TEMP\n2-fixture.exe" 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\probe.log"
          $code = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @('### Extension pre-check', '```', (Get-Content -Raw "$env:RUNNER_TEMP\probe.log").Trim(), '```')
          exit $code
