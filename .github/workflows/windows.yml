# ACCEPTANCE-ONLY PROBE (#50 native triage). Never merge into main.
# Runs only the updater source-guard Rust tests to tell a test-order artifact
# from a product failure. No installer, no npm, no signing, no uploads.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows CPU architecture
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Probe runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This probe runs only from an accept/* branch" }
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Source guard tests, alone and in their default order
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/guard-probe.noindex
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $base = @('test', '--manifest-path', 'client/src-desktop-updater/Cargo.toml', '--locked', '--target', 'x86_64-pc-windows-msvc', '--test', 'windows_source_guard', '--')
          $keep = { param($lines) $lines | ForEach-Object { "$_" } | Where-Object { $_ -match '^test result:|^test .* (FAILED|ok|ignored)$|panicked at|^\s+(left|right):' } }
          "== A: the parent-unknown test alone (own process) =="
          $a = & cargo @base '--exact' 'system::a_process_not_started_by_electron_main_is_refused' '--test-threads=1' 2>&1; $codeA = $LASTEXITCODE
          & $keep $a
          "== B: all source-guard tests, one thread, default order (as acceptance) =="
          $b = & cargo @base '--test-threads=1' 2>&1; $codeB = $LASTEXITCODE
          & $keep $b
          "== C: the late-old-app test, then the parent-unknown test, same process =="
          $c = & cargo @base 'system::a_' '--test-threads=1' '--skip' 'a_running_old' 2>&1; $codeC = $LASTEXITCODE
          & $keep $c
          "exit codes: A=$codeA B=$codeB C=$codeC"
          "| run | exit |`n|---|---|`n| A alone | $codeA |`n| B default order | $codeB |`n| C late-old-app then parent-unknown | $codeC |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
