# ACCEPTANCE-ONLY PROBE (#50 S2 check: process start watcher). Never merge into
# main. Runs the final branch's own watchStarts; no TaroBird build, install or upload.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows CPU architecture
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Probe runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This probe runs only from an accept/* branch" }
      - uses: actions/checkout@v4
      - name: Process start watcher probe (same shell chain as the acceptance step)
        shell: pwsh
        run: |
          node --version
          node client/scripts/acceptance-probe/startwatch-probe.mjs
