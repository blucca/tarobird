# ACCEPTANCE-ONLY PROBE (#50 extension A1: shortcut target under a CJK path).
# Never merge into main. A tiny NSIS fixture, no TaroBird installer, no uploads.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows CPU architecture
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Probe runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This probe runs only from an accept/* branch" }
      - uses: actions/checkout@v4
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: CJK shortcut target probe (installer's own CreateShortcut + SetLnkAppUserModelId)
        shell: pwsh
        working-directory: client/scripts/acceptance-probe
        run: |
          $cjk = -join ([char]0x9A8C, [char]0x6536, ' ', [char]0x76EE, [char]0x5F55)
          $dir = Join-Path $env:RUNNER_TEMP "TB $cjk\TaroBird"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "$env:WINDIR\System32\whoami.exe" (Join-Path $dir 'tarocub-client.exe')
          makensis /V2 "/DOUT=$env:RUNNER_TEMP\lnk-cjk-probe.exe" lnk-cjk-probe.nsi
          if ($LASTEXITCODE -ne 0) { throw "fixture did not compile" }
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\lnk-cjk-probe.exe" -ArgumentList "/S /D=$dir" -Wait -PassThru
          "fixture exit $($p.ExitCode)"
          $link = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\TaroBird CJK Probe.lnk'
          if (-not (Test-Path -LiteralPath $link)) { throw "PROBE FAIL: no shortcut" }
          $expected = Join-Path $dir 'tarocub-client.exe'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File lnk-cjk-read.ps1 -Link $link -Expected $expected -Out "$env:RUNNER_TEMP\read-ps51.json"
          pwsh -NoProfile -NonInteractive -File lnk-cjk-read.ps1 -Link $link -Expected $expected -Out "$env:RUNNER_TEMP\read-ps7.json"
          $a = Get-Content -Raw "$env:RUNNER_TEMP\read-ps51.json" | ConvertFrom-Json; $b = Get-Content -Raw "$env:RUNNER_TEMP\read-ps7.json" | ConvertFrom-Json
          "ps51 json: $(Get-Content -Raw "$env:RUNNER_TEMP\read-ps51.json")"
          "ps7  json: $(Get-Content -Raw "$env:RUNNER_TEMP\read-ps7.json")"
          Remove-Item -LiteralPath $link -Force
          if (-not $a.bytesHaveUtf16Dir) { "VERDICT: the .lnk does not hold the CJK directory as UTF-16 (product side)"; exit 1 }
          if ($a.shellEqual -and -not $a.wshEqual) { "VERDICT: the .lnk is correct; WScript.Shell TargetPath loses the CJK characters (acceptance read method)" }
          elseif ($a.shellEqual -and $a.wshEqual) { "VERDICT: every read is correct here; the extension failure needs another cause" }
          else { "VERDICT: unexpected combination, see the json" }
