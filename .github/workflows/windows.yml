# ACCEPTANCE-ONLY PROBE (#50 shortcut AppID read and Start index timing).
# Never merge into main. A tiny NSIS fixture, no TaroBird installer, no uploads.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows CPU architecture
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Probe runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This probe runs only from an accept/* branch" }
      - uses: actions/checkout@v4
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Compile and run the AppID fixture (installer's own SetLnkAppUserModelId)
        shell: pwsh
        working-directory: client/scripts/acceptance-probe
        run: |
          makensis /V2 "/DOUT=$env:RUNNER_TEMP\appid-probe.exe" appid-probe.nsi
          if ($LASTEXITCODE -ne 0) { throw "fixture did not compile" }
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\appid-probe.exe" -ArgumentList '/S' -Wait -PassThru
          "fixture exit $($p.ExitCode)"
      - name: Read the shortcut property and poll Start apps (judged read, recorded index timing)
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\TaroBird AppID Probe'
          function AppId([string]$name) { $i = (New-Object -ComObject Shell.Application).Namespace($dir).ParseName($name); [string]$i.ExtendedProperty('System.AppUserModel.ID') }
          $withId = AppId 'TaroBird AppID Probe.lnk'; $plain = AppId 'TaroBird AppID Probe Plain.lnk'
          "shortcut property: probe='$withId' plain='$plain'"
          $polls = @(); $listed = $false; $start = Get-Date
          for ($t = 0; $t -le 60; $t += 5) {
            $hit = @(Get-StartApps | Where-Object { $_.AppID -eq 'com.tarobot.client.appidprobe' })
            $named = @(Get-StartApps | Where-Object { $_.Name -like 'TaroBird AppID Probe*' } | ForEach-Object { "$($_.Name)=$($_.AppID)" })
            $polls += "$([int]((Get-Date) - $start).TotalSeconds)s:$(if ($hit.Count) { 'listed' } else { 'absent' }) [$($named -join '; ')]"
            if ($hit.Count) { $listed = $true; break }
            Start-Sleep -Seconds 5
          }
          $polls | ForEach-Object { "poll $_" }
          "| item | value |`n|---|---|`n| probe property | $withId |`n| plain property | $plain |`n| Start listed within 60 s | $listed |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($withId -ne 'com.tarobot.client.appidprobe' -or $plain -ne '') { throw "PROBE FAIL: the property read does not tell the AppID shortcut from the plain one" }
          "PROBE PASS: property read works (probe=$withId, plain=none); Start listed the AppID within 60 s: $listed"
