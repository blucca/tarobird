# ACCEPTANCE-ONLY PROBE (#50 extension B-3: what the published 1.5.0 uninstaller shows).
# Never merge into main. Downloads only the pinned published 1.5.0; no build, no candidate, no uploads.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows CPU architecture
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Probe runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This probe runs only from an accept/* branch" }
      - uses: actions/checkout@v4
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: What the published 1.5.0 uninstaller shows when the installer runs it interactively in place
        shell: pwsh
        working-directory: client/scripts/acceptance-probe
        run: |
          $url = 'https://github.com/cloveric/tarobird/releases/download/windows-tarobot-v1.5.0/TaroBird_1.5.0_x64-setup.exe'
          $file = Join-Path $env:RUNNER_TEMP 'TaroBird_1.5.0_x64-setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $file -UseBasicParsing
          $len = (Get-Item $file).Length; $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "1.5.0 download: $len bytes, sha256 $sha"
          if ($len -ne 262755192 -or $sha -ne 'deb9382a818647fbe34b9faa62ceb310e42505b60b0cc22edd2cb03813c4a419') { throw "PROBE FAIL: 1.5.0 does not match the pinned size and hash" }
          $p = Start-Process -FilePath $file -ArgumentList '/S' -Wait -PassThru; "1.5.0 /S exit $($p.ExitCode)"
          $dir = (Get-ItemProperty 'HKCU:\Software\tarocub\TaroBot').'(default)'
          $lang = (Get-ItemProperty 'HKCU:\Software\tarocub\TaroBot' -ErrorAction SilentlyContinue).'Installer Language'
          "install dir $dir; Installer Language = $(if ($null -eq $lang) { 'absent' } else { $lang })"
          $us = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\TaroBot').UninstallString
          "UninstallString $us"
          # The installer's interactive reinst_uninstall: ExecWait '<UninstallString> _?=<dir>' (installer.nsi).
          $out = Join-Path $env:RUNNER_TEMP 'old-uninstaller-windows.jsonl'
          $exe = $us.Trim('"')
          $u = Start-Process -FilePath $exe -ArgumentList "_?=$dir" -PassThru
          "started $exe _?=$dir as pid $($u.Id)"
          foreach ($t in 0, 2, 4, 6, 10, 15, 20, 30, 45, 60) {
            while (((Get-Date) - $u.StartTime).TotalSeconds -lt $t) { Start-Sleep -Milliseconds 200 }
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File old-uninstaller-windows.ps1 -Out $out -At $t
            if ($u.HasExited) { "uninstaller exited with $($u.ExitCode) by ${t}s"; break }
          }
          Get-Content -LiteralPath $out -Encoding utf8 | ForEach-Object { "snapshot $_" }
          if (-not $u.HasExited) { "uninstaller still running after 60 s; ending its tree"; taskkill /PID $u.Id /T /F | Out-Null }
