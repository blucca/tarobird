# ACCEPTANCE-ONLY FIXTURE CHECK COPY (#50 native, follow-up). Never merge this file
# into main: it builds no installer, signs nothing, uploads nothing and publishes
# nothing. It runs only the Windows cases touched by the test-fixture commits:
# step 17 desktop-core, the step 19 native tests (judged like windows-acceptance.mjs),
# the source-guard binary serial and under the default parallel harness, main's
# client.yml Windows updater command, the where.exe Node fallback, and one in-runner
# mutation of the duplicate-argument check (never committed).
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Windows CPU architecture
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAROBOT_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Fixture checks run only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "This acceptance-only workflow copy runs only from an accept/* branch" }
          "runner=$env:RUNNER_ENVIRONMENT os=$env:ImageOS image=$env:ImageVersion ref=$env:REF cpus=$env:NUMBER_OF_PROCESSORS"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          save-if: false
      - run: npm ci
      - run: npm ci --prefix client
      - name: Pinned Host Node runtime (same archive and SHA-256 as scripts/prepare-desktop-host.mjs)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/node-v24.22.3-win-x64.zip"
          Invoke-WebRequest -Uri 'https://nodejs.org/dist/v24.22.3/node-v24.22.3-win-x64.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'e612af99f626ab415ea225af6bce5c971feb448cb5cae250bb1c3fa50c5f7d9f') { throw "Node archive integrity failed: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/host-node" -Force
          "PINNED_NODE=$env:RUNNER_TEMP/host-node/node-v24.22.3-win-x64/node.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          rustc -Vv; cargo -V
      - name: Step 17 desktop-core exact command
        id: core
        continue-on-error: true
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-native-tests.noindex
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $env:TAROBOT_TEST_NODE = $env:PINNED_NODE
          cargo test --manifest-path client/src-desktop-core/Cargo.toml --locked -- --test-threads=1
          "RESULT core exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "desktop-core failed" }
      - name: desktop_host lab through the where.exe Node fallback (no TAROBOT_TEST_NODE)
        id: fallback
        continue-on-error: true
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-native-tests.noindex
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          Remove-Item Env:TAROBOT_TEST_NODE -ErrorAction SilentlyContinue
          "where.exe node.exe -> $((where.exe node.exe | Select-Object -First 1))"
          cargo test --manifest-path client/src-desktop-core/Cargo.toml --locked --lib -- --test-threads=1 desktop_host::tests
          "RESULT fallback exit=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { throw "desktop_host lab failed through the where.exe fallback" }
      - name: Mutation (in runner only) - duplicate --state-dir detection removed must fail the config test
        id: mutation
        continue-on-error: true
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-native-tests.noindex
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $file = 'client/src-desktop-core/src/config.rs'
          $from = 'if slot.replace(value).is_some() { return Err("invalid_arguments"); }'
          $text = Get-Content $file -Raw
          if (-not $text.Contains($from)) { throw "mutation anchor not found" }
          Set-Content $file -Value $text.Replace($from, 'let _ = slot.replace(value);') -NoNewline
          cargo test --manifest-path client/src-desktop-core/Cargo.toml --locked --lib -- --test-threads=1 --exact config::tests::requires_every_fixed_path_once_and_rejects_ambiguity
          $code = $LASTEXITCODE
          git checkout -- $file
          if ((git status --porcelain -- $file)) { throw "mutation not reverted" }
          "RESULT mutation exit=$code (non-zero = the broken duplicate check is detected)"
          if ($code -eq 0) { throw "duplicate-argument mutation survived on Windows" }
      - name: Step 19 native exact command, judged like windows-acceptance.mjs
        id: native19
        continue-on-error: true
        shell: pwsh
        env:
          TAROBOT_WINDOWS_ACCEPTANCE: disposable
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-native-tests.noindex
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item Env:RUSTFLAGS -ErrorAction SilentlyContinue
          Remove-Item Env:CARGO_ENCODED_RUSTFLAGS -ErrorAction SilentlyContinue
          & cargo test --manifest-path client/src-desktop-updater/Cargo.toml --locked --target x86_64-pc-windows-msvc `
            --test windows_runtime --test windows_control_job --test windows_source_guard -- --test-threads=1 --nocapture 2>&1 | Tee-Object -Variable out | Write-Output
          $code = $LASTEXITCODE
          $stdout = @(@($out) | Where-Object { $_ -isnot [System.Management.Automation.ErrorRecord] } | ForEach-Object { "$_" })
          $passed = @($stdout | Where-Object { $_ -match '^test result: ok\. (\d+) passed' } | ForEach-Object { [int]($_ -replace '^test result: ok\. (\d+) passed.*$', '$1') })
          $vacuous = @(@($out) | ForEach-Object { "$_" } | Where-Object { $_ -match '^skipped:' }).Count -gt 0
          $judged = ($code -eq 0) -and ($passed.Count -eq 3) -and (@($passed | Where-Object { $_ -le 0 }).Count -eq 0) -and (-not $vacuous)
          "JUDGED native/controljob-guard-helper-handoff=$judged code=$code passed=[$($passed -join ',')] vacuous=$vacuous"
          if (-not $judged) { throw "step 19 native not judged pass" }
      - name: Source guard - serial once, then 20 rounds of the default parallel harness
        id: guard
        continue-on-error: true
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-native-tests.noindex
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item Env:RUST_TEST_THREADS -ErrorAction SilentlyContinue
          $base = @('test', '--manifest-path', 'client/src-desktop-updater/Cargo.toml', '--locked', '--target', 'x86_64-pc-windows-msvc', '--test', 'windows_source_guard')
          & cargo @($base + @('--', '--test-threads=1')) 2>&1 | Tee-Object -Variable serial | Write-Output
          $serialCode = $LASTEXITCODE
          "RESULT guard-serial exit=$serialCode"
          $failedRounds = 0; $failures = @{}
          foreach ($round in 1..20) {
            & cargo @base 2>&1 | Tee-Object -Variable out | Out-Null
            $code = $LASTEXITCODE
            $names = @(@($out) | ForEach-Object { "$_" } | Where-Object { $_ -match '^test (\S+) \.\.\. FAILED$' } | ForEach-Object { ($_ -replace '^test (\S+) \.\.\. FAILED$', '$1') })
            $result = @(@($out) | ForEach-Object { "$_" } | Where-Object { $_ -match '^test result:' }) -join ' | '
            "ROUND $round parallel exit=$code $result $(if ($names) { 'FAILED: ' + ($names -join ',') })"
            if ($code -ne 0) { $failedRounds++; foreach ($n in $names) { $failures[$n] = 1 + [int]$failures[$n] } ; @(@($out) | ForEach-Object { "$_" } | Where-Object { $_ -match 'panicked at|left:|right:|failed in its own process' }) | Select-Object -First 12 | ForEach-Object { "    $_" } }
          }
          "RESULT guard-parallel failedRounds=$failedRounds/20 byTest=$(($failures.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" }) -join ';')"
          if ($serialCode -ne 0 -or $failedRounds -gt 0) { throw "source guard failed (serial $serialCode, parallel rounds $failedRounds/20)" }
      - name: main client.yml Windows updater command, 3 rounds (default env and parallel harness)
        id: clientyml
        continue-on-error: true
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/windows-client-yml.noindex
        run: |
          $ErrorActionPreference = 'Continue'
          Remove-Item Env:RUST_TEST_THREADS -ErrorAction SilentlyContinue
          $failedRounds = 0
          foreach ($round in 1..3) {
            & cargo test --manifest-path client/src-desktop-updater/Cargo.toml --locked 2>&1 | Tee-Object -Variable out | Out-Null
            $code = $LASTEXITCODE
            $names = @(@($out) | ForEach-Object { "$_" } | Where-Object { $_ -match '^test (\S+) \.\.\. FAILED$' } | ForEach-Object { ($_ -replace '^test (\S+) \.\.\. FAILED$', '$1') })
            "ROUND $round client.yml exit=$code results: $(@(@($out) | ForEach-Object { "$_" } | Where-Object { $_ -match '^test result:' }) -join ' | ') $(if ($names) { 'FAILED: ' + ($names -join ',') })"
            if ($code -ne 0) { $failedRounds++; @(@($out) | ForEach-Object { "$_" } | Where-Object { $_ -match 'panicked at|left:|right:|failed in its own process|^error' }) | Select-Object -First 12 | ForEach-Object { "    $_" } }
          }
          "RESULT clientyml failedRounds=$failedRounds/3"
          if ($failedRounds -gt 0) { throw "client.yml updater command failed in $failedRounds/3 rounds" }
      - name: Fixture check outcome
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $o = 'core=${{ steps.core.outcome }} fallback=${{ steps.fallback.outcome }} mutation=${{ steps.mutation.outcome }} native19=${{ steps.native19.outcome }} guard=${{ steps.guard.outcome }} clientyml=${{ steps.clientyml.outcome }}'
          "OUTCOME $o"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "OUTCOME $o"
          if ($o -match 'failure') { throw "fixture check found failures: $o" }
