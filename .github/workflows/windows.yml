# ACCEPTANCE-ONLY PROBE BRANCH (#50 extension pre-check). Never merge into main.
# Builds and installs no TaroBird package: pinned release downloads (hash only,
# nothing is run from them), an NSIS fixture for the CJK/space directory and
# review N2, and driver syntax. No upload, signing or release.
name: Windows desktop installer
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Unused by this probe
        type: choice
        options: [x64]
        default: x64
permissions:
  contents: read
jobs:
  extension-probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Acceptance-only guard (disposable GitHub-hosted runner, no uploads)
        shell: pwsh
        env:
          REF: ${{ github.ref }}
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw "Probe runs only on a disposable GitHub-hosted runner" }
          if (-not $env:REF.StartsWith('refs/heads/accept/')) { throw "Probe runs only from an accept/* branch" }
          "runner=$env:RUNNER_ENVIRONMENT image=$env:ImageOS $env:ImageVersion ref=$env:REF"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            client/scripts
            client/windows-electron
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: "Build the fixtures (dialog from the product's .nsh files, link, B-3 pair; -INPUTCHARSET UTF8 as the product)"
        shell: pwsh
        run: |
          $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) { choco install nsis --no-progress -y | Out-Null }
          if (-not $makensis) { $makensis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe", "$env:ChocolateyInstall\bin\makensis.exe", (Get-Command makensis -ErrorAction SilentlyContinue).Source) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1 }
          if (-not $makensis) { throw "makensis not found after choco install" }
          & $makensis -VERSION
          foreach ($name in 'dialog-fixture', 'lnk-fixture', 'b3-old', 'b3-new') {
            & $makensis -V2 -INPUTCHARSET UTF8 "-DSRC=$PWD\client\windows-electron" "-DOUT=$env:RUNNER_TEMP\$name.exe" "client/scripts/acceptance-probe/$name.nsi"
            if ($LASTEXITCODE -ne 0) { throw "fixture $name failed" }
          }
      - name: "Round-2 pre-check: shortcut read, UTF-8 driver output, NSIS-only buttons and helper exits, B-3 driver"
        shell: pwsh
        run: |
          node client/scripts/acceptance-probe/fixes-probe.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\probe.log"
          $code = $LASTEXITCODE
          foreach ($f in 'windows-install-ui-driver.ps1', 'windows-dialog-text-driver.ps1', 'windows-uninstall-ui-driver.ps1') { $e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\client\scripts\$f", [ref]$null, [ref]$e); "parse ${f}: $(if ($e) { $e } else { 'OK' })" }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value @('### Round-2 pre-check', '```', (Get-Content -Raw "$env:RUNNER_TEMP\probe.log").Trim(), '```')
          exit $code
